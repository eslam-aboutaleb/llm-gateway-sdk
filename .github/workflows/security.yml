name: Security & License Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-and-licenses:
    name: Secret Scan, Dependency Audit & License Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --group dev --frozen
      - name: Verify permissive licenses in runtime dependencies
        run: |
          uv run --frozen python - <<'PY'
          import importlib.metadata
          forbidden_tokens = (
              "GNU General Public License",
              "Affero General Public License",
              "Lesser General Public License",
              "Server Side Public License",
              "Business Source License",
              "GPL-",
              "AGPL-",
              "LGPL-",
              "SSPL",
              "BUSL",
              "BSL-1.1",
          )
          for dist in importlib.metadata.distributions():
              name = dist.metadata["Name"]
              lic_fields = [
                  dist.metadata.get("License") or "",
                  dist.metadata.get("License-Expression") or "",
                  *(dist.metadata.get_all("Classifier") or []),
              ]
              combined = " | ".join(lic_fields)
              for bad in forbidden_tokens:
                  if bad in combined:
                      raise SystemExit(f"Forbidden license token '{bad}' detected in {name}: {combined}")
          print("All installed package licenses verified permissive.")
          PY

