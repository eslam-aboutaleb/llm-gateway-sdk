name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-typecheck:
    name: Lint, Format & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --group dev --frozen
      - name: Ruff lint
        run: uv run --frozen ruff check .
      - name: Ruff format check
        run: uv run --frozen ruff format --check .
      - name: Strict Mypy type check
        run: uv run --frozen mypy

  test-matrix:
    name: Unit, Integration & Contract Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --group dev --frozen --python ${{ matrix.python-version }}
      - name: Run keyless test suite with coverage
        run: uv run --frozen pytest --cov=llm_gateway_sdk --cov-report=term-missing --cov-report=xml:coverage.xml

  core-isolation:
    name: Core Minimal Dependency Isolation Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.10"
      - name: Install core package only (no optional extras)
        run: uv sync --no-dev --frozen --python 3.10
      - name: Verify core imports without optional packages installed
        run: |
          uv run --no-dev python -c "
          import importlib.util
          from llm_gateway_sdk import GatewaySettings
          s = GatewaySettings(base_url='https://gateway.example.com/v1', api_key='sk-test')
          c = s.create_client()
          c.close()
          for optional_pkg in ('openai', 'pydantic_settings', 'instructor', 'langchain_openai', 'traceloop'):
              assert importlib.util.find_spec(optional_pkg) is None, f'{optional_pkg} should not be in core'
          "

  build-package:
    name: Build & Validate Wheel and sdist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.11"
      - name: Install build tools
        run: uv sync --group dev --frozen
      - name: Build wheel and sdist
        run: uv build
      - name: Validate package metadata with Twine
        run: uv run --frozen twine check dist/*
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-packages
          path: dist/*
          retention-days: 7

